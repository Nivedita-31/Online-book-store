<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online book store</title>

<style>
    .header{
        background: rgb(68, 0, 255);
        height: 80px;

    .logo img{

        height: 100%;

    }

    }
    .menu a{

        color: blue;
        font-weight: bold;
    }
    .main{
        display: flex;
        height: 300px;
        background: rgb(0, 255, 251);
    }
    .left{
        width:200px ;

        display:flex;
        flex-direction: column;
        justify-content: space-around; 
    }
    .right{
        flex: 1;
        border: 1px solid black;
        padding: 20px;
    }
    .iframe{
        display: flex;
        justify-content: space-around;
    }
    .right iframe{
        width: 100%;
        height: 100%;
        border: navy;
    }
</style>

        </div>
